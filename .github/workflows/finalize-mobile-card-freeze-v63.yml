name: Finalize mobile card freeze v63

on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-card-freeze-v63.yml'
      - 'tools/finalize-mobile-card-freeze-v63.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v63 freeze guards
        run: python tools/finalize-mobile-card-freeze-v63.py
      - name: Commit v63
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-mobile-card-freeze-v63.yml tools/finalize-mobile-card-freeze-v63.py
          git add -A
          git commit -m "Prevent mobile member-card freeze v63"
          git push
