name: Finalize mobile header v11

on:
  push:
    paths:
      - '.github/workflows/mobile-header-v11.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh mobile header assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sync = Path('album-theme-sync.js')
          text = sync.read_text()
          text = re.sub(r"const MOBILE_ASSET_VERSION = '[^']+';", "const MOBILE_ASSET_VERSION = 'mobile-header-v11';", text)
          sync.write_text(text)

          for name in ('index.html', 'members.html'):
              path = Path(name)
              html = path.read_text()
              html = re.sub(r'album-theme-sync\.js\?v=[^"\']+', 'album-theme-sync.js?v=mobile-header-v11', html)
              path.write_text(html)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album-theme-sync.js index.html members.html
          git diff --cached --quiet || git commit -m "Finalize swapped mobile header"
          git push
