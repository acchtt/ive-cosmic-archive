name: Run LUMINARE logo unification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run registered logo unification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/unify-luminare-logo.yml').read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Standardize LUMINARE identity\n        shell: bash\n        run: \|\n([\s\S]*?)\n      - name: Commit unified identity",
              workflow,
          )
          if not match:
              raise RuntimeError('Could not locate registered LUMINARE logo rollout')

          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          Path('/tmp/unify-luminare-logo.sh').write_text(script + '\n', encoding='utf-8')
          PY
          bash /tmp/unify-luminare-logo.sh

      - name: Commit production identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/luminare-mark.svg header-editorial-glass.css revive-member-sets.js *.html
          git commit -m "Unify LUMINARE logo across the archive"
          git push origin main
