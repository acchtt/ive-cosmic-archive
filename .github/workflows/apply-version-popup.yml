name: Apply REVIVE+ version popup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-version-popup.yml'

permissions:
  contents: write

jobs:
  apply-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert version selector into bottom popup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')

          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", "const ARCHIVE_VERSION = '0.13.0';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", "const ARCHIVE_BUILD = '013';", js, count=1)

          read_anchor = '''  function readStoredSet() {
    try {
      const stored = window.localStorage.getItem(STORAGE_KEY);
      return SETS[stored] ? stored : 'bangers';
    } catch {
      return 'bangers';
    }
  }
'''
          read_replacement = read_anchor + '''
  function hasStoredSet() {
    try {
      return Boolean(SETS[window.localStorage.getItem(STORAGE_KEY)]);
    } catch {
      return false;
    }
  }
'''
          if 'function hasStoredSet()' not in js:
              if read_anchor not in js:
                  raise RuntimeError('Stored-set anchor not found')
              js = js.replace(read_anchor, read_replacement, 1)

          popup_block = '''  function setSwitcherOpen(switcher, open) {
    if (!switcher) return;
    switcher.dataset.open = String(open);
    const toggle = switcher.querySelector('[data-member-set-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', String(open));
  }

  function createSwitcher() {
    const existing = document.querySelector('[data-member-set-switcher]');
    if (existing) return existing;

    const switcher = document.createElement('aside');
    const startOpen = !hasStoredSet();
    switcher.className = 'member-set-switcher-popup';
    switcher.dataset.memberSetSwitcher = '';
    switcher.dataset.open = String(startOpen);
    switcher.setAttribute('aria-label', 'REVIVE+ album-version theme selector');
    switcher.innerHTML = `
      <button class="member-set-dock" type="button" data-member-set-toggle aria-expanded="${startOpen}" aria-controls="revive-version-menu">
        <span class="member-set-dock-dot" aria-hidden="true"></span>
        <span class="member-set-dock-label">REVIVE+ edition</span>
        <strong data-member-set-title>${SETS[activeSetId].label}</strong>
        <span class="member-set-dock-action" aria-hidden="true">Change</span>
      </button>
      <div class="member-set-popover" id="revive-version-menu" role="dialog" aria-label="Choose a REVIVE+ album version">
        <div class="member-set-popover-head">
          <div>
            <span>REVIVE+ archive coordinate</span>
            <strong>Choose an edition</strong>
          </div>
          <button type="button" class="member-set-close" data-member-set-close aria-label="Close edition menu">×</button>
        </div>
        <p data-member-set-description>${SETS[activeSetId].description}</p>
        <div class="member-set-options" role="group" aria-label="Choose a REVIVE+ album-version theme and member-card set">
          ${SET_ORDER.map((setId) => `
            <button type="button" data-member-set="${setId}" aria-pressed="${setId === activeSetId}" aria-label="Use the ${SETS[setId].label} version theme">
              <span>${SETS[setId].label}</span>
              <small>06 cards</small>
            </button>`).join('')}
        </div>
      </div>`;

    document.body.appendChild(switcher);

    switcher.addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-member-set-toggle]');
      if (toggle) {
        setSwitcherOpen(switcher, switcher.dataset.open !== 'true');
        return;
      }

      if (event.target.closest('[data-member-set-close]')) {
        setSwitcherOpen(switcher, false);
        return;
      }

      const button = event.target.closest('[data-member-set]');
      if (!button || !SETS[button.dataset.memberSet]) return;
      setActiveSet(button.dataset.memberSet);
      setSwitcherOpen(switcher, false);
      switcher.querySelector('[data-member-set-toggle]')?.focus();
    });

    document.addEventListener('pointerdown', (event) => {
      if (switcher.dataset.open !== 'true' || switcher.contains(event.target)) return;
      setSwitcherOpen(switcher, false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || switcher.dataset.open !== 'true') return;
      setSwitcherOpen(switcher, false);
      switcher.querySelector('[data-member-set-toggle]')?.focus();
    });

    return switcher;
  }

  function updateThemeColor'''

          js, count = re.subn(
              r'  function createSwitcher\(\) \{[\s\S]*?\n  \}\n\n  function updateThemeColor',
              popup_block,
              js,
              count=1
          )
          if count != 1:
              raise RuntimeError('Could not replace switcher function')

          set_active_pattern = re.compile(r'''  function setActiveSet\(setId\) \{\n    if \(!SETS\[setId\] \|\| setId === activeSetId\) return;\n    activeSetId = setId;\n    selectionVersion \+= 1;\n    storeSet\(setId\);\n    applyCurrentSet\(\);\n    window\.dispatchEvent\(new CustomEvent\('revive-member-set-change', \{\n      detail: \{ id: setId, label: SETS\[setId\]\.label, themeColor: SETS\[setId\]\.themeColor \}\n    \}\)\);\n  \}''')
          set_active_replacement = '''  function setActiveSet(setId) {
    if (!SETS[setId]) return;

    storeSet(setId);
    if (setId === activeSetId) {
      updateSwitcher();
      return;
    }

    activeSetId = setId;
    selectionVersion += 1;
    applyCurrentSet();
    window.dispatchEvent(new CustomEvent('revive-member-set-change', {
      detail: { id: setId, label: SETS[setId].label, themeColor: SETS[setId].themeColor }
    }));
  }'''
          js, count = set_active_pattern.subn(set_active_replacement, js, count=1)
          if count != 1:
              raise RuntimeError('Could not update active-set handler')

          js_path.write_text(js, encoding='utf-8')

          css_path = Path('revive-member-sets.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'/\* VERSION POPUP v[\s\S]*? END \*/\s*$', '', css).rstrip()
          popup_css = r'''

/* VERSION POPUP v0.13.0 START */
.member-set-switcher-popup {
  --popup-accent: var(--set-accent, #ff8fc7);
  --popup-secondary: var(--set-accent-2, #ffd3e7);
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 160;
  width: min(360px, calc(100vw - 32px));
  pointer-events: none;
}

.member-set-dock {
  pointer-events: auto;
  width: max-content;
  max-width: 100%;
  min-height: 46px;
  margin-left: auto;
  padding: 0 14px 0 12px;
  display: grid;
  grid-template-columns: 8px auto auto auto;
  align-items: center;
  gap: 9px;
  border: 1px solid color-mix(in srgb, var(--popup-accent) 24%, rgba(255,255,255,.09));
  border-radius: 999px;
  color: var(--set-paper, white);
  background:
    linear-gradient(110deg, color-mix(in srgb, var(--set-bg) 88%, transparent), color-mix(in srgb, var(--set-panel-strong) 88%, transparent));
  box-shadow: 0 14px 38px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter: blur(22px) saturate(1.15);
  cursor: pointer;
}

.member-set-dock:hover,
.member-set-dock:focus-visible,
.member-set-switcher-popup[data-open="true"] .member-set-dock {
  border-color: color-mix(in srgb, var(--popup-accent) 52%, white 8%);
  box-shadow: 0 16px 46px rgba(0, 0, 0, .4), 0 0 24px color-mix(in srgb, var(--popup-accent) 10%, transparent);
}

.member-set-dock-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--popup-accent);
  box-shadow: 0 0 12px color-mix(in srgb, var(--popup-accent) 72%, transparent);
}

.member-set-dock-label,
.member-set-dock-action {
  font-size: .52rem;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.member-set-dock-label { color: color-mix(in srgb, var(--set-muted) 72%, transparent); }
.member-set-dock strong { font-size: .68rem; letter-spacing: .08em; }
.member-set-dock-action { color: color-mix(in srgb, var(--popup-accent) 72%, white 10%); }

.member-set-popover {
  pointer-events: auto;
  position: absolute;
  right: 0;
  bottom: calc(100% + 10px);
  width: 100%;
  padding: 14px;
  border: 1px solid color-mix(in srgb, var(--popup-accent) 26%, rgba(255,255,255,.09));
  border-radius: 19px;
  color: var(--set-paper, white);
  background:
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--popup-accent) 13%, transparent), transparent 36%),
    linear-gradient(145deg, color-mix(in srgb, var(--set-panel-strong) 96%, transparent), color-mix(in srgb, var(--set-bg) 94%, transparent));
  box-shadow: 0 24px 74px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter: blur(26px) saturate(1.18);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px) scale(.975);
  transform-origin: right bottom;
  transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
}

.member-set-switcher-popup[data-open="true"] .member-set-popover {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.member-set-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}

.member-set-popover-head > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.member-set-popover-head span {
  color: color-mix(in srgb, var(--set-muted) 70%, transparent);
  font-size: .48rem;
  font-weight: 750;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.member-set-popover-head strong {
  font-size: 1rem;
  letter-spacing: -.02em;
}

.member-set-close {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 50%;
  color: color-mix(in srgb, var(--set-paper) 68%, transparent);
  background: rgba(255,255,255,.035);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}

.member-set-close:hover,
.member-set-close:focus-visible {
  color: white;
  border-color: color-mix(in srgb, var(--popup-accent) 52%, white 8%);
}

.member-set-popover > p {
  margin: 0 0 12px;
  color: color-mix(in srgb, var(--set-muted) 76%, transparent);
  font-size: .68rem;
  line-height: 1.45;
}

.member-set-switcher-popup .member-set-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.member-set-switcher-popup .member-set-options button {
  min-height: 52px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 2px;
  border: 1px solid rgba(255,255,255,.085);
  border-radius: 12px;
  color: color-mix(in srgb, var(--set-paper) 62%, transparent);
  background: rgba(255,255,255,.025);
  cursor: pointer;
  text-align: left;
  transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
}

.member-set-switcher-popup .member-set-options button::before { display: none; }
.member-set-switcher-popup .member-set-options button span { font-size: .63rem; font-weight: 850; letter-spacing: .08em; }
.member-set-switcher-popup .member-set-options button small { color: color-mix(in srgb, var(--set-muted) 60%, transparent); font-size: .48rem; letter-spacing: .1em; text-transform: uppercase; }

.member-set-switcher-popup .member-set-options button:hover,
.member-set-switcher-popup .member-set-options button:focus-visible {
  color: white;
  border-color: color-mix(in srgb, var(--option-a) 48%, white 8%);
  background: color-mix(in srgb, var(--option-a) 8%, rgba(255,255,255,.025));
  transform: translateY(-1px);
}

.member-set-switcher-popup .member-set-options button[aria-pressed="true"] {
  color: white;
  border-color: color-mix(in srgb, var(--option-a) 62%, white 12%);
  background:
    linear-gradient(120deg, color-mix(in srgb, var(--option-a) 18%, transparent), color-mix(in srgb, var(--option-b) 9%, transparent));
  box-shadow: inset 3px 0 0 var(--option-a), 0 8px 22px color-mix(in srgb, var(--option-a) 9%, transparent);
}

@media (max-width: 640px) {
  .member-set-switcher-popup {
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    width: auto;
  }

  .member-set-dock {
    width: 100%;
    grid-template-columns: 8px auto 1fr auto;
  }

  .member-set-dock strong { justify-self: start; }
  .member-set-popover { width: 100%; transform-origin: center bottom; }
}

@media (prefers-reduced-motion: reduce) {
  .member-set-popover,
  .member-set-switcher-popup .member-set-options button {
    transition: none;
  }
}
/* VERSION POPUP v0.13.0 END */
'''
          css_path.write_text(css + popup_css, encoding='utf-8')

          for html_name in ['index.html', 'members.html', 'eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              match = re.search(r'<p class="footer-code">(.*?)</p>', text, flags=re.S)
              if not match:
                  continue
              value = match.group(1).strip()
              value = re.sub(r'Archive build\s*·\s*\d+', 'Archive build · 013', value)
              value = re.sub(r'\s*·\s*v\d+(?:\.\d+){1,2}.*$', '', value)
              value = f'{value} · v0.13.0'
              text = text[:match.start()] + f'<p class="footer-code">{value}</p>' + text[match.end():]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit popup selector to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revive-member-sets.js revive-member-sets.css index.html members.html eras.html media.html
          git commit -m "Move REVIVE+ selector into a bottom popup"
          git push origin main

# Trigger popup application
