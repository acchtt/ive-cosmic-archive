name: Apply REVIVE+ popup from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run the registered popup patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-version-popup.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n([\s\S]*?)\n          PY", workflow)
          if not match:
              raise RuntimeError('Could not locate popup patch in registered workflow')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, 'apply-version-popup.yml', 'exec'))
          PY

      - name: Commit popup selector to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revive-member-sets.js revive-member-sets.css index.html members.html eras.html media.html
          git commit -m "Move REVIVE+ selector into a bottom popup"
          git push origin main
