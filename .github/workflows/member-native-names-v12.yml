name: Finalize mobile member names v12

on:
  push:
    paths:
      - '.github/workflows/member-native-names-v12.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add mobile member-name assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          anchor = '  <script src="home-revive.js" defer></script>'
          addition = '''  <script src="home-revive.js" defer></script>
  <link rel="stylesheet" href="mobile-home-member-names.css?v=member-names-v12" media="(max-width: 640px)" />
  <script src="mobile-home-member-names.js?v=member-names-v12" defer></script>'''

          if 'mobile-home-member-names.js?v=member-names-v12' not in text:
              if anchor not in text:
                  raise SystemExit('Home script anchor not found')
              text = text.replace(anchor, addition, 1)
              path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load mobile native member names'
          git push origin main
