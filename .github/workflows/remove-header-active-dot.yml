name: Refine editorial glass header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-header-active-dot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Strengthen Option B styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '0.18.0'
          BUILD = '018'

          css_path = Path('header-editorial-glass.css')
          css = css_path.read_text(encoding='utf-8')
          start = '/* Option B refinement: visible editorial glass. */'
          if start in css:
              css = css.split(start, 1)[0].rstrip()

          refinement = r'''

/* Option B refinement: visible editorial glass. */
html body .site-header {
  top: 12px;
  height: 76px;
  border-color: color-mix(in srgb, var(--header-accent) 36%, rgba(255,255,255,.16));
  background:
    linear-gradient(112deg, rgba(255,255,255,.055), transparent 24%),
    radial-gradient(circle at 12% -90%, color-mix(in srgb, var(--header-accent-2) 24%, transparent), transparent 48%),
    radial-gradient(circle at 82% 155%, color-mix(in srgb, var(--header-accent) 26%, transparent), transparent 52%),
    linear-gradient(135deg,
      color-mix(in srgb, var(--header-panel) 86%, transparent),
      color-mix(in srgb, var(--header-bg) 68%, transparent));
  box-shadow:
    0 24px 68px rgba(0,0,0,.42),
    0 0 44px color-mix(in srgb, var(--header-accent) 11%, transparent),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -24px 46px color-mix(in srgb, var(--header-accent) 4%, transparent);
  backdrop-filter: blur(30px) saturate(1.32);
  -webkit-backdrop-filter: blur(30px) saturate(1.32);
}

html body .site-header::before {
  inset: 5px;
  border-color: rgba(255,255,255,.065);
  background:
    linear-gradient(105deg, rgba(255,255,255,.045), transparent 22%),
    linear-gradient(180deg, rgba(255,255,255,.026), transparent 54%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
}

html body .site-header::after {
  left: 16%;
  right: 14%;
  bottom: -11px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    color-mix(in srgb, var(--header-accent) 30%, transparent) 0%,
    color-mix(in srgb, var(--header-accent-2) 12%, transparent) 38%,
    transparent 72%);
  filter: blur(9px);
  opacity: .7;
}

html body .site-header.scrolled {
  border-color: color-mix(in srgb, var(--header-accent) 42%, rgba(255,255,255,.16));
  background:
    linear-gradient(112deg, rgba(255,255,255,.05), transparent 24%),
    radial-gradient(circle at 82% 155%, color-mix(in srgb, var(--header-accent) 22%, transparent), transparent 50%),
    linear-gradient(135deg,
      color-mix(in srgb, var(--header-panel) 93%, transparent),
      color-mix(in srgb, var(--header-bg) 78%, transparent));
  box-shadow:
    0 28px 78px rgba(0,0,0,.48),
    0 0 46px color-mix(in srgb, var(--header-accent) 10%, transparent),
    inset 0 1px 0 rgba(255,255,255,.11);
}

html body .site-header .brand-mark {
  text-shadow:
    0 0 20px color-mix(in srgb, var(--header-accent) 20%, transparent),
    0 1px 0 rgba(255,255,255,.08);
}

html body .site-header .brand-sub {
  color: color-mix(in srgb, var(--header-muted) 72%, white 22%);
  border-left-color: color-mix(in srgb, var(--header-accent) 34%, rgba(255,255,255,.18));
}

html body .site-header .site-nav a {
  color: color-mix(in srgb, var(--header-muted) 70%, white 18%);
}

/* Keep only the luminous underline; remove the small navigation dot. */
html body .site-header .site-nav a::before {
  content: none !important;
  display: none !important;
}

html body .site-header .site-nav a::after {
  bottom: -10px;
  height: 3px;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--header-accent) 88%, white 6%),
    var(--header-accent-2));
  box-shadow:
    0 0 9px color-mix(in srgb, var(--header-accent) 72%, transparent),
    0 5px 18px color-mix(in srgb, var(--header-accent) 28%, transparent);
}

html body .site-header .site-nav a[aria-current="page"] {
  text-shadow: 0 0 18px color-mix(in srgb, var(--header-accent) 34%, transparent);
}

html body .site-header .motion-toggle {
  border-color: color-mix(in srgb, var(--header-accent) 38%, rgba(255,255,255,.16));
  background:
    linear-gradient(120deg, rgba(255,255,255,.07), transparent 34%),
    radial-gradient(circle at 18% 0%, color-mix(in srgb, var(--header-accent) 18%, transparent), transparent 58%),
    rgba(255,255,255,.035);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    0 8px 24px rgba(0,0,0,.18);
}

html body .site-header .motion-dot {
  width: 8px;
  height: 8px;
  box-shadow:
    0 0 11px var(--header-accent),
    0 0 24px color-mix(in srgb, var(--header-accent) 45%, transparent);
}

@media (max-width: 980px) {
  html body .site-header {
    height: 70px;
  }

  html body .site-header .site-nav {
    background:
      linear-gradient(112deg, rgba(255,255,255,.045), transparent 28%),
      radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--header-accent) 20%, transparent), transparent 42%),
      color-mix(in srgb, var(--header-panel) 92%, transparent);
    border-color: color-mix(in srgb, var(--header-accent) 38%, rgba(255,255,255,.12));
    box-shadow:
      0 24px 64px rgba(0,0,0,.5),
      0 0 34px color-mix(in srgb, var(--header-accent) 9%, transparent),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
}

@media (max-width: 640px) {
  html body .site-header {
    height: 64px;
  }
}
'''
          css_path.write_text(css + refinement, encoding='utf-8')

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", f"const ARCHIVE_VERSION = '{VERSION}';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", f"const ARCHIVE_BUILD = '{BUILD}';", js, count=1)
          js_path.write_text(js, encoding='utf-8')

          for html_name in ['index.html', 'members.html', 'eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header-editorial-glass.css revive-member-sets.js index.html members.html eras.html media.html
          git commit -m "Strengthen editorial glass header styling"
          git push origin main
