name: Fix CHALLENGERS member cards v53

on:
  push:
    paths:
      - '.github/workflows/fix-challengers-member-cards-v53.yml'
      - 'tools/fix-challengers-member-cards-v53.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v53 CHALLENGERS member-card fix
        run: python tools/fix-challengers-member-cards-v53.py
      - name: Commit v53
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CHALLENGERS member cards v53"
          git push
