name: Fetch CHALLENGERS Concept Photo 2 cards v55

on:
  push:
    paths:
      - '.github/workflows/fetch-challengers-concept2-v55.yml'
      - 'tools/fetch-challengers-concept2-v55.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch and install CHALLENGERS Concept Photo 2 cards
        run: python tools/fetch-challengers-concept2-v55.py
      - name: Commit v55
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace CHALLENGERS cards with Concept Photo 2 v55"
          git push
