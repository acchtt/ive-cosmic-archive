name: Refresh mobile shell v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-mobile-shell-v9.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh mobile bootstrap references
        run: |
          sed -i 's/album-theme-sync.js?v=cover-cards-v8/album-theme-sync.js?v=mobile-shell-v9/g' index.html members.html
          rm .github/workflows/refresh-mobile-shell-v9.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html members.html .github/workflows/refresh-mobile-shell-v9.yml
          git commit -m "Finalize mobile shell correction"
          git push
