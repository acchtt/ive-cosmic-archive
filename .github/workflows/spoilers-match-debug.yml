name: SPOILERS match debug

on:
  push:
    paths:
      - '.github/workflows/spoilers-match-debug.yml'

permissions:
  contents: write

jobs:
  build-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official media and build contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p .debug/spoilers
          while read -r label id; do
            curl -fsSL -A 'Mozilla/5.0' "https://pbs.twimg.com/media/${id}?format=jpg&name=small" -o ".debug/spoilers/${label}.jpg"
          done <<'EOF'
          gaeul_1 G_rOpkKW0AAt_VT
          gaeul_2 G_rOpjmbAActtQy
          gaeul_3 G_rOpjjbAAI0Zzf
          gaeul_4 G_rOpjmbAAQBfI8
          yujin_1 G_rOv2YWUAAIiFJ
          yujin_2 G_rOv1ubAA4SvQa
          yujin_3 G_rOv13bAAMOrul
          yujin_4 G_rOv13bAAQe8wW
          rei_1 G_rOezsbAAMPcHx
          rei_2 G_rOe0eXkAAoJhq
          rei_3 G_rOezqbAAAfAON
          rei_4 G_rOezqbAAQFtyK
          wonyoung_1 G_rOSXybAAAljAV
          wonyoung_2 G_rOSXzbAAI1Sw8
          wonyoung_3 G_rOSXwbAAAbVQs
          wonyoung_4 G_rOSX8akAAzmg2
          liz_1 G_rOkQNbAAISHNb
          liz_2 G_rOkQHbAAQJamW
          liz_3 G_rOkQMbAAAQ3UB
          liz_4 G_rOkQKbAAUrjeA
          leeseo_1 G_rOYd2bAAIkmSu
          leeseo_2 G_rOYdzbAAkE4IN
          leeseo_3 G_rOYdzbAAgBg7K
          leeseo_4 G_rOYd4bIAAifZF
          EOF
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          members=['gaeul','yujin','rei','wonyoung','liz','leeseo']
          cell=(320,400); gap=12; label_h=34
          sheet=Image.new('RGB',(4*cell[0]+5*gap,6*(cell[1]+label_h)+7*gap),'white')
          draw=ImageDraw.Draw(sheet)
          for r,m in enumerate(members):
              for c in range(4):
                  p=Path(f'.debug/spoilers/{m}_{c+1}.jpg')
                  im=Image.open(p).convert('RGB')
                  fit=ImageOps.fit(im,cell,method=Image.Resampling.LANCZOS)
                  x=gap+c*(cell[0]+gap); y=gap+r*(cell[1]+label_h+gap)
                  sheet.paste(fit,(x,y+label_h))
                  draw.text((x+6,y+8),f'{m.upper()} {c+1}',fill='black')
          sheet.save('.debug/spoilers-match-contact-sheet.jpg',quality=88)
          PY
      - name: Commit contact sheet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .debug/spoilers-match-contact-sheet.jpg
          git commit -m 'Add temporary SPOILERS match contact sheet'
          git push
