name: Import REVIVE+ member-card assets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/import-revive-assets.trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0

      - name: Download and localize member-card images
        run: python3 scripts/import_revive_member_assets.py

      - name: Commit localized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/revive/member-cards revive-member-sets.js member-cards.css index.html members.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Localize all REVIVE+ member-card assets"
          TARGET_BRANCH="${{ github.event.pull_request.head.ref }}"
          if [ -z "$TARGET_BRANCH" ]; then TARGET_BRANCH="main"; fi
          git push origin "HEAD:$TARGET_BRANCH"
