name: Run REVIVE+ palette correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected palettes
        run: python3 scripts/apply_revive_palette_correction.py

      - name: Commit corrected palettes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revive-member-sets.css revive-member-sets.js *.html
          git commit -m "Correct REVIVE+ album-version palettes"
          git push origin main
