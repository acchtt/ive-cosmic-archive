name: Member identity birthday v48

on:
  push:
    paths:
      - '.github/workflows/finalize-member-identity-v48.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v48 identity layout
        run: python tools/finalize-member-identity-v48.py
      - name: Commit final v48
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move birthdays into member identity and revert social pills v48"
          git push
