name: Member signature era reveal v51

on:
  push:
    paths:
      - '.github/workflows/member-signature-reveal-v51.yml'
      - 'tools/member-signature-reveal-v51.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v51 signature reveal
        run: python tools/member-signature-reveal-v51.py
      - name: Commit v51
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade member signature era reveal v51"
          git push
