name: Apply single-layer member cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-single-layer-member-cards.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate portrait layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '0.16.0'
          BUILD = '016'

          css_path = Path('member-cards.css')
          css = css_path.read_text(encoding='utf-8')

          css = re.sub(
              r'/\*\n   Homepage card fit strategy:[\s\S]*?\*/',
              '''/*
   Homepage card fit strategy:
   - render each portrait exactly once
   - use cover to fill the card without a second enlarged copy behind it
   - keep the existing text-legibility gradient as the only overlay
*/''',
              css,
              count=1,
          )

          css = re.sub(
              r'\.member-card \.member-art \{[\s\S]*?\n\}',
              '''.member-card .member-art {
  background-color: #090710;
  background-image: var(--member-portrait);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center top;
  filter: saturate(.96) contrast(1.03);
  isolation: isolate;
}''',
              css,
              count=1,
          )

          css = re.sub(
              r'\.member-card \.member-art::before \{[\s\S]*?\n\}',
              '''.member-card .member-art::before {
  content: none;
  display: none;
}''',
              css,
              count=1,
          )

          if 'background-image: var(--member-portrait);' not in css:
              raise RuntimeError('Single-layer portrait rule was not applied')
          if 'content: none;' not in css:
              raise RuntimeError('Duplicate portrait pseudo-element was not disabled')

          css_path.write_text(css, encoding='utf-8')

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", f"const ARCHIVE_VERSION = '{VERSION}';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", f"const ARCHIVE_BUILD = '{BUILD}';", js, count=1)
          js_path.write_text(js, encoding='utf-8')

          for html_name in ['index.html', 'members.html', 'eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member-cards.css revive-member-sets.js index.html members.html eras.html media.html
          git commit -m "Remove duplicate member-card portrait silhouettes"
          git push origin main
