name: Inspect Spoilers candidates

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  download-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-revive-member-mappings
          fetch-depth: 0

      - name: Download candidate images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          import time

          candidates = {
              'rei': ['QzkZue5','JGJe8Z2','k82x3Cr','9lCLKgA','cwCDsBn','6Vw8aFa','eimFTEB','HptaZta','tcMoUt2','BXTxBOk','Mzwjkxd','LdhiE6g','kFQu8tO','blUwr2A','Eimswes'],
              'leeseo': ['qZgZL3X','wADkLMC','fAxHA7F','p6V7PWS','jwF6PO3','KGSGu9d','v8Hx7FJ','2wfP9xh','PWHBROy','JzR0f2N','fnzIxcz','V7mLr5T','FXwyhEe','H3CiZjF','f9BLVAY'],
          }
          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.ptt.cc/'}
          root = Path('tmp/revive-spoilers-candidates')
          for member, ids in candidates.items():
              folder = root / member
              folder.mkdir(parents=True, exist_ok=True)
              for index, image_id in enumerate(ids):
                  url = f'https://imgur.com/{image_id}.jpg'
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  if len(data) < 20000 or not data.startswith(b'\xff\xd8\xff'):
                      raise RuntimeError(f'Invalid image: {url} ({len(data)} bytes)')
                  target = folder / f'{index:02d}-{image_id}.jpg'
                  target.write_bytes(data)
                  print(target, len(data))
                  time.sleep(0.1)
          PY

      - name: Commit candidates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/revive-spoilers-candidates
          git commit -m "Add Spoilers portrait candidates"
          git push origin fix-revive-member-mappings
