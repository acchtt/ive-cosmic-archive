name: Inspect Spoilers candidates

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-revive-member-mappings
          fetch-depth: 0

      - name: Fetch official tweet metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import urllib.parse
          import urllib.request

          tweets = {
              'rei': [
                  '2016150820228890959',
                  '2016150841498206610',
                  '2016150859290444248',
                  '2016150875480481982',
              ],
              'leeseo': [
                  '2016150712049402127',
                  '2016150728646262878',
                  '2016150745087914014',
                  '2016150760975913281',
              ],
          }
          headers = {'User-Agent': 'Mozilla/5.0'}
          root = Path('tmp/revive-spoilers-tweets')
          root.mkdir(parents=True, exist_ok=True)

          for member, ids in tweets.items():
              for index, tweet_id in enumerate(ids):
                  urls = {
                      'syndication': f'https://cdn.syndication.twimg.com/tweet-result?id={tweet_id}&lang=en',
                      'oembed': 'https://publish.twitter.com/oembed?' + urllib.parse.urlencode({
                          'url': f'https://x.com/IVEstarship/status/{tweet_id}',
                          'omit_script': 'true',
                      }),
                  }
                  result = {'tweet_id': tweet_id}
                  for key, url in urls.items():
                      try:
                          request = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(request, timeout=60) as response:
                              payload = response.read().decode('utf-8')
                          try:
                              result[key] = json.loads(payload)
                          except json.JSONDecodeError:
                              result[key] = payload
                      except Exception as exc:
                          result[key] = {'error': str(exc)}
                  target = root / f'{member}-{index}-{tweet_id}.json'
                  target.write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
                  print(target)
          PY

      - name: Commit tweet metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/revive-spoilers-tweets
          git commit -m "Add official Spoilers tweet metadata"
          git push origin fix-revive-member-mappings
