name: Inspect Spoilers candidates

on:
  pull_request:
    branches: [main]

jobs:
  build-contact-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-revive-member-mappings

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Build contact sheets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          source_root = Path('tmp/revive-spoilers-official')
          output_root = Path('tmp/spoilers-contact-sheets')
          output_root.mkdir(parents=True, exist_ok=True)

          thumb_w, thumb_h = 280, 360
          label_h = 42
          columns = 5
          font = ImageFont.load_default()

          for member in ('rei', 'leeseo'):
              files = sorted((source_root / member).glob('*.*'))
              files = [path for path in files if path.suffix.lower() in {'.jpg', '.jpeg', '.png'}]
              rows = (len(files) + columns - 1) // columns
              sheet = Image.new('RGB', (columns * thumb_w, rows * (thumb_h + label_h)), 'white')
              draw = ImageDraw.Draw(sheet)

              for index, path in enumerate(files):
                  image = Image.open(path).convert('RGB')
                  fitted = ImageOps.contain(image, (thumb_w - 12, thumb_h - 12))
                  tile = Image.new('RGB', (thumb_w, thumb_h), '#111111')
                  x = (thumb_w - fitted.width) // 2
                  y = (thumb_h - fitted.height) // 2
                  tile.paste(fitted, (x, y))

                  col = index % columns
                  row = index // columns
                  px = col * thumb_w
                  py = row * (thumb_h + label_h)
                  sheet.paste(tile, (px, py))
                  label = path.stem.rsplit('-', 1)[0]
                  draw.text((px + 8, py + thumb_h + 12), label, fill='black', font=font)

              sheet.save(output_root / f'{member}-contact-sheet.jpg', quality=90)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: spoilers-contact-sheets
          path: tmp/spoilers-contact-sheets/*.jpg
          retention-days: 1
