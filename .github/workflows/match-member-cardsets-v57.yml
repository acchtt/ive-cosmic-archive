name: Match member cardsets v57

on:
  push:
    paths:
      - '.github/workflows/match-member-cardsets-v57.yml'
      - 'tools/match-member-cardsets-v57.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portrait matching dependencies
        run: python -m pip install --disable-pip-version-check pillow requests opencv-python-headless
      - name: Select and install portrait-matched member cards
        run: python tools/match-member-cardsets-v57.py
      - name: Commit v57
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match REVIVE+ member card portraits v57"
          git push
