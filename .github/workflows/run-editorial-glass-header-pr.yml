name: Run editorial glass header rollout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run registered header patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-editorial-glass-header.yml').read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Install REVIVE\+ editorial glass header\n        shell: bash\n        run: \|\n([\s\S]*?)\n      - name: Commit production header",
              workflow,
          )
          if not match:
              raise RuntimeError('Could not locate editorial glass header patch')

          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          Path('/tmp/apply-editorial-header.sh').write_text(script + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-editorial-header.sh

      - name: Commit production header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header-editorial-glass.css index.html members.html eras.html media.html revive-member-sets.js
          git commit -m "Redesign header with REVIVE+ editorial glass styling"
          git push origin main
