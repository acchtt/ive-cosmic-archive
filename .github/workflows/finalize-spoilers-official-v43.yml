name: Finalize SPOILERS official media v43

on:
  push:
    paths:
      - '.github/workflows/finalize-spoilers-official-v43.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply verified official SPOILERS media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = 'mobile-spoilers-hires-sync-v42'
          new = 'mobile-spoilers-official-media-v43'

          for name in ('album-theme-sync.js', 'mobile-version-cardsets.js', 'mobile-members-redesign.js', 'home-revive.js', 'index.html', 'members.html'):
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Missing old version token in {name}')
              path.write_text(text.replace(old, new))

          path = Path('mobile-version-cardsets.js')
          text = path.read_text()
          replacement = """    spoilers: {
              label: 'SPOILERS',
              featureIndex: 4,
              // Media slot 3 from each member's official IVE SPOILERS post.
              // Liz slot 3 is the approved blue press/nameplate portrait; using
              // the same slot across all six official posts keeps the sub-series synchronized.
              portraits: [
                'https://pbs.twimg.com/media/G_rOpjjbAAI0Zzf?format=jpg&name=orig',
                'https://pbs.twimg.com/media/G_rOv13bAAMOrul?format=jpg&name=orig',
                'https://pbs.twimg.com/media/G_rOezqbAAAfAON?format=jpg&name=orig',
                'https://pbs.twimg.com/media/G_rOSXwbAAAbVQs?format=jpg&name=orig',
                'https://pbs.twimg.com/media/G_rOkQMbAAAQ3UB?format=jpg&name=orig',
                'https://pbs.twimg.com/media/G_rOYdzbAAgBg7K?format=jpg&name=orig'
              ]
            },
            'loved-ive': {"""
          pattern = r"    spoilers: \{.*?\n    \},\n    'loved-ive': \{"
          text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Could not replace SPOILERS block: {count}')
          path.write_text(text2)

          path = Path('home-revive.js')
          text = path.read_text()
          old_liz = 'https://f.ptcdn.info/433/090/000/mkwpgjojoSD3a7wmO3B-o.jpg'
          new_liz = 'https://pbs.twimg.com/media/G_rOkQMbAAAQ3UB?format=jpg&name=orig'
          if old_liz not in text:
              raise SystemExit('Could not locate current Home Liz source')
          text = text.replace(old_liz, new_liz, 1)
          text = text.replace('LIZ in the REVIVE+ SPOILERS synchronized concept-card set', 'LIZ in the REVIVE+ official SPOILERS concept-photo set')
          path.write_text(text)

          path = Path('mobile-header-members-v38.css')
          text = path.read_text()
          text = text.replace('Mobile v42', 'Mobile v43')
          text = text.replace(
              'v42 SPOILERS uses six separate high-resolution member images rather than a sprite.',
              'v43 SPOILERS uses six separate original-size media files from the official member posts.'
          )
          path.write_text(text)

          path = Path('mobile-members-redesign.js')
          text = path.read_text().replace(
              'Six member dossiers synchronized to the SPOILERS press-conference concept set.',
              'Six member dossiers synchronized to the official SPOILERS concept-photo set.'
          )
          path.write_text(text)
          PY

      - name: Remove temporary extraction files
        run: |
          rm -f functions/api/spoilers-source.js
          rm -f .github/workflows/spoilers-media-debug.yml
          rm -f .github/workflows/finalize-spoilers-official-v43.yml

      - name: Commit verified v43
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use official SPOILERS member media v43"
          git push
