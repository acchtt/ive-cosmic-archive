name: Show launch popup on reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-launch-popup-reload.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make reload reopen launch picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '0.16.0'
          BUILD = '016'

          for html_name in ['index.html', 'members.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')

              old = """      try {
        launchRequired = sessionStorage.getItem('ive-cosmic-revive-launch-seen') !== 'true'
|| !editions.has(localStorage.getItem('ive-cosmic-revive-member-set'));
      } catch {"""
              old_spaced = """      try {
        launchRequired = sessionStorage.getItem('ive-cosmic-revive-launch-seen') !== 'true'
          || !editions.has(localStorage.getItem('ive-cosmic-revive-member-set'));
      } catch {"""
              new = """      try {
        const navigation = performance.getEntriesByType?.('navigation')?.[0];
        const reloaded = navigation?.type === 'reload' || performance.navigation?.type === 1;
        launchRequired = reloaded
          || sessionStorage.getItem('ive-cosmic-revive-launch-seen') !== 'true'
          || !editions.has(localStorage.getItem('ive-cosmic-revive-member-set'));
      } catch {"""

              if old in text:
                  text = text.replace(old, new, 1)
              elif old_spaced in text:
                  text = text.replace(old_spaced, new, 1)
              elif "const reloaded = navigation?.type === 'reload'" not in text:
                  raise RuntimeError(f'Launch gate anchor not found in {html_name}')

              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)
              path.write_text(text, encoding='utf-8')

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", f"const ARCHIVE_VERSION = '{VERSION}';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", f"const ARCHIVE_BUILD = '{BUILD}';", js, count=1)

          helper_anchor = """  function hasSeenLaunchPicker() {
    try {
      return window.sessionStorage.getItem(LAUNCH_KEY) === 'true';
    } catch {
      return false;
    }
  }
"""
          helper = helper_anchor + """
  function isReloadNavigation() {
    try {
      const navigation = window.performance?.getEntriesByType?.('navigation')?.[0];
      return navigation?.type === 'reload' || window.performance?.navigation?.type === 1;
    } catch {
      return false;
    }
  }
"""
          if 'function isReloadNavigation()' not in js:
              if helper_anchor not in js:
                  raise RuntimeError('Launch helper anchor not found')
              js = js.replace(helper_anchor, helper, 1)

          old_launch = "    const launchOpen = !hasSeenLaunchPicker() || !hasStoredSet();"
          new_launch = "    const launchOpen = isReloadNavigation() || !hasSeenLaunchPicker() || !hasStoredSet();"
          if old_launch in js:
              js = js.replace(old_launch, new_launch, 1)
          elif new_launch not in js:
              raise RuntimeError('Launch-open condition not found')

          js_path.write_text(js, encoding='utf-8')

          for html_name in ['eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html members.html eras.html media.html revive-member-sets.js
          git commit -m "Show launch theme popup after hard refresh"
          git push origin main
