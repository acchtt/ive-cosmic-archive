name: Apply LUMINARE brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-luminare-brand.yml'

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install LUMINARE identity
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/luminare-mark.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <ellipse cx="32" cy="32" rx="25" ry="13" fill="none" stroke="#ff789c" stroke-width="2" transform="rotate(-14 32 32)"/>
            <path fill="#ffd9e4" d="M32 3l4.6 23.4L61 32l-24.4 5.6L32 61l-4.6-23.4L3 32l24.4-5.6L32 3z"/>
            <circle cx="49" cy="15" r="3.2" fill="#ff789c"/>
          </svg>
          SVG

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '0.19.0'
          BUILD = '019'
          BRAND = 'LUMINARE'

          brand_pattern = re.compile(
              r'(?P<open><a class="brand(?: footer-brand)?" href="index\.html"[^>]*>)\s*'
              r'<span class="brand-mark">IVE</span>\s*'
              r'<span class="brand-sub">Cosmic Archive</span>\s*'
              r'</a>',
              re.S,
          )

          def replace_brand(match):
              opening = match.group('open')
              opening = opening.replace('IVE Cosmic Archive home', 'LUMINARE IVE Archive home')
              if 'aria-label=' not in opening:
                  opening = opening[:-1] + ' aria-label="LUMINARE IVE Archive home">'
              return f'''{opening}
        <span class="brand-emblem" aria-hidden="true"></span>
        <span class="brand-lockup">
          <span class="brand-mark">{BRAND}</span>
          <span class="brand-sub">IVE Archive</span>
        </span>
      </a>'''

          for html_name in ['index.html', 'members.html', 'eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('IVE Cosmic Archive', 'LUMINARE · IVE Archive')
              text = brand_pattern.sub(replace_brand, text)
              if 'assets/luminare-mark.svg' not in text:
                  text = text.replace('</title>', '</title>\n  <link rel="icon" type="image/svg+xml" href="assets/luminare-mark.svg" />', 1)
              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)
              path.write_text(text, encoding='utf-8')

          css_path = Path('header-editorial-glass.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* LUMINARE identity lockup. */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip()

          css += r'''

/* LUMINARE identity lockup. */
html body .site-header {
  grid-template-columns: minmax(268px, auto) 1fr auto;
}

html body .site-header .brand,
html body .site-footer .brand {
  align-items: center;
  gap: 13px;
}

html body .brand-emblem {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  background: linear-gradient(145deg,
    color-mix(in srgb, var(--header-paper, #fff7fb) 92%, var(--header-accent, #ff789c) 8%),
    var(--header-accent, #ff789c) 58%,
    var(--header-accent-2, #ffd08d));
  -webkit-mask: url("assets/luminare-mark.svg") center / contain no-repeat;
  mask: url("assets/luminare-mark.svg") center / contain no-repeat;
  filter:
    drop-shadow(0 0 8px color-mix(in srgb, var(--header-accent, #ff789c) 52%, transparent))
    drop-shadow(0 0 18px color-mix(in srgb, var(--header-accent, #ff789c) 18%, transparent));
}

html body .brand-lockup {
  min-width: 0;
  display: grid;
  gap: 4px;
  padding-left: 14px;
  border-left: 1px solid color-mix(in srgb, var(--header-accent, #ff789c) 34%, rgba(255,255,255,.18));
  line-height: 1;
}

html body .site-header .brand-mark,
html body .site-footer .brand-mark {
  color: var(--header-paper, #fff7fb);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: .17em;
  text-shadow:
    0 0 18px color-mix(in srgb, var(--header-accent, #ff789c) 22%, transparent),
    0 1px 0 rgba(255,255,255,.08);
}

html body .site-header .brand-sub,
html body .site-footer .brand-sub {
  margin: 0;
  padding: 0;
  border: 0;
  color: color-mix(in srgb, var(--header-muted, #bbaeb9) 76%, white 16%);
  font-size: .52rem;
  font-weight: 650;
  letter-spacing: .26em;
  text-transform: uppercase;
  white-space: nowrap;
}

html body .site-footer .footer-brand {
  width: max-content;
}

html body .site-footer .brand-emblem {
  width: 30px;
  height: 30px;
  flex-basis: 30px;
}

html body .site-footer .brand-lockup {
  gap: 3px;
  padding-left: 12px;
}

@media (max-width: 980px) {
  html body .site-header {
    grid-template-columns: auto 1fr auto auto;
  }

  html body .site-header .brand-lockup {
    padding-left: 11px;
  }

  html body .site-header .brand-mark {
    font-size: .94rem;
    letter-spacing: .13em;
  }
}

@media (max-width: 640px) {
  html body .site-header .brand {
    gap: 8px;
  }

  html body .site-header .brand-emblem {
    width: 28px;
    height: 28px;
    flex-basis: 28px;
  }

  html body .site-header .brand-lockup {
    padding-left: 9px;
  }

  html body .site-header .brand-mark {
    font-size: .82rem;
    letter-spacing: .1em;
  }

  html body .site-header .brand-sub {
    display: none;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", f"const ARCHIVE_VERSION = '{VERSION}';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", f"const ARCHIVE_BUILD = '{BUILD}';", js, count=1)
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit LUMINARE production brand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/luminare-mark.svg header-editorial-glass.css index.html members.html eras.html media.html revive-member-sets.js
          git commit -m "Rebrand archive as LUMINARE"
          git push origin main
