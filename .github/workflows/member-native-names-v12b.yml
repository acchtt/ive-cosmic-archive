name: Member native names v12

on: push

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Insert mobile member assets
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); a="  <script src=\"home-revive.js\" defer></script>"; b=a+"\n  <link rel=\"stylesheet\" href=\"mobile-home-member-names.css?v=member-names-v12\" media=\"(max-width: 640px)\" />\n  <script src=\"mobile-home-member-names.js?v=member-names-v12\" defer></script>"; p.write_text(s if "mobile-home-member-names.js?v=member-names-v12" in s else s.replace(a,b,1))'
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Load mobile native member names'
          git push origin main
