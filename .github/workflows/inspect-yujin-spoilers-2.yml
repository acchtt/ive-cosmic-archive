name: Apply tighter Yujin Spoilers crop

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-yujin-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace Yujin Spoilers card and update manifest
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import hashlib
          import json
          import urllib.request

          url = 'https://f.ptcdn.info/433/090/000/mkwpas8aordLG72JJwg-o.jpg'
          target = Path('assets/revive/member-cards/spoilers/yujin.jpg')
          request = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://pantip.com/',
          })
          with urllib.request.urlopen(request, timeout=60) as response:
              source_data = response.read()
          if len(source_data) < 100000 or not source_data.startswith(b'\xff\xd8\xff'):
              raise RuntimeError(f'Invalid Yujin image: {len(source_data)} bytes')

          image = Image.open(BytesIO(source_data)).convert('RGB')
          # Tighten the full-body portrait so Yujin fills the card more consistently.
          crop = (900, 45, 1390, 875)
          portrait = image.crop(crop)
          output = BytesIO()
          portrait.save(output, format='JPEG', quality=95, optimize=True)
          data = output.getvalue()
          target.write_bytes(data)

          manifest_path = Path('assets/revive/member-cards/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for asset in manifest['assets']:
              if asset.get('set') == 'spoilers' and asset.get('member') == 'yujin':
                  asset.update({
                      'source': url,
                      'resolved_source': url,
                      'source_page': 'https://pantip.com/topic/43959310',
                      'official_account': 'https://x.com/IVEstarship',
                      'crop': list(crop),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
                  asset.pop('official_post', None)
                  break
          else:
              raise RuntimeError('Yujin Spoilers manifest entry not found')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit replacement to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/revive/member-cards/spoilers/yujin.jpg assets/revive/member-cards/manifest.json
          git commit -m "Tighten Yujin Spoilers portrait crop"
          git push origin main
