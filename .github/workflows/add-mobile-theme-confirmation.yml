name: Add mobile theme confirmation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-mobile-theme-confirmation.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add confirmation interaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          js = replace_once(js, "  const ARCHIVE_VERSION = '0.20.0';\n  const ARCHIVE_BUILD = '021';", "  const ARCHIVE_VERSION = '0.20.1';\n  const ARCHIVE_BUILD = '022';", 'version bump')
          js = replace_once(js, "      description: 'Black-stage portraits cut by laser green light and cold mint styling.',\n      themeColor: '#10e68a',\n      tags: ['Laser green', 'Black stage', 'Cold mint', 'Challenge mode'],", "      description: 'Ivory tailoring, oxide red, concrete gray, and open-sky blue from the CHALLENGERS cover and concept set.',\n      themeColor: '#b62d24',\n      tags: ['Ivory', 'Oxide red', 'Concrete', 'Sky blue'],", 'challengers copy')
          js = replace_once(js, "  let activeSetId = readStoredSet();\n  let selectionVersion = 0;", "  let activeSetId = readStoredSet();\n  let pendingSetId = activeSetId;\n  let selectionVersion = 0;", 'pending state')

          helper_anchor = "  function createSwitcher() {\n"
          helpers = """  function setPendingSet(switcher, setId) {
            if (!switcher || !SETS[setId]) return;
            pendingSetId = setId;
            switcher.dataset.pendingSet = setId;

            switcher.querySelectorAll('.member-set-options [data-member-set]').forEach((button) => {
              button.setAttribute('aria-pressed', String(button.dataset.memberSet === setId));
            });

            const description = switcher.querySelector('[data-member-set-description]');
            const pending = switcher.querySelector('[data-member-set-pending]');
            const confirm = switcher.querySelector('[data-member-set-confirm]');
            if (description) description.textContent = SETS[setId].description;
            if (pending) pending.textContent = `Selected: ${SETS[setId].label}`;
            if (confirm) {
              confirm.textContent = `Use ${SETS[setId].label}`;
              confirm.setAttribute('aria-label', `Confirm the ${SETS[setId].label} archive theme`);
            }
          }

          function resetPendingSet(switcher) {
            setPendingSet(switcher, activeSetId);
          }

          function commitPendingSet(switcher) {
            const setId = SETS[pendingSetId] ? pendingSetId : activeSetId;
            const wasLaunch = switcher.dataset.launch === 'true';
            setActiveSet(setId);
            if (wasLaunch) markLaunchPickerSeen();
            setLaunchPending(false);
            switcher.dataset.launch = 'false';
            switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
            setSwitcherOpen(switcher, false);
            showChangeHint(switcher);
            switcher.querySelector('[data-member-set-toggle]')?.focus();
          }

"""
          js = replace_once(js, helper_anchor, helpers + helper_anchor, 'helper insertion')

          old_markup = """        <div class=\"member-set-options\" role=\"group\" aria-label=\"Choose a REVIVE+ album-version theme and member-card set\">
${SET_ORDER.map((setId) => `
  <button type=\"button\" data-member-set=\"${setId}\" aria-pressed=\"${setId === activeSetId}\" aria-label=\"Use the ${SETS[setId].label} version theme\">
    <span>${SETS[setId].label}</span>
    <small>06 cards</small>
  </button>`).join('')}
        </div>
      </div>`;"""
          new_markup = """        <div class=\"member-set-options\" role=\"group\" aria-label=\"Choose a REVIVE+ album-version theme and member-card set\">
${SET_ORDER.map((setId) => `
  <button type=\"button\" data-member-set=\"${setId}\" aria-pressed=\"${setId === activeSetId}\" aria-label=\"Select the ${SETS[setId].label} version theme\">
    <span>${SETS[setId].label}</span>
    <small>06 cards</small>
  </button>`).join('')}
        </div>
        <div class=\"member-set-confirm-row\">
          <span data-member-set-pending>Selected: ${SETS[activeSetId].label}</span>
          <button type=\"button\" class=\"member-set-confirm\" data-member-set-confirm aria-label=\"Confirm the ${SETS[activeSetId].label} archive theme\">Use ${SETS[activeSetId].label}</button>
        </div>
      </div>`;"""
          js = replace_once(js, old_markup, new_markup, 'confirmation markup')

          js = replace_once(js, "    document.body.appendChild(switcher);\n\n    if (launchOpen) {", "    document.body.appendChild(switcher);\n    resetPendingSet(switcher);\n\n    if (launchOpen) {", 'initial pending sync')

          old_handler = """      const toggle = event.target.closest('[data-member-set-toggle]');
      if (toggle) {
        switcher.dataset.launch = 'false';
        switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
        setSwitcherOpen(switcher, switcher.dataset.open !== 'true');
        return;
      }

      if (event.target.closest('[data-member-set-close]')) {
        if (switcher.dataset.launch === 'true') return;
        setSwitcherOpen(switcher, false);
        return;
      }

      const button = event.target.closest('[data-member-set]');
      if (!button || !SETS[button.dataset.memberSet]) return;

      const wasLaunch = switcher.dataset.launch === 'true';
      setActiveSet(button.dataset.memberSet);
      if (wasLaunch) markLaunchPickerSeen();
      setLaunchPending(false);
      switcher.dataset.launch = 'false';
      switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
      setSwitcherOpen(switcher, false);
      showChangeHint(switcher);
      switcher.querySelector('[data-member-set-toggle]')?.focus();
"""
          new_handler = """      const toggle = event.target.closest('[data-member-set-toggle]');
      if (toggle) {
        switcher.dataset.launch = 'false';
        switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
        const willOpen = switcher.dataset.open !== 'true';
        if (willOpen) resetPendingSet(switcher);
        setSwitcherOpen(switcher, willOpen);
        return;
      }

      if (event.target.closest('[data-member-set-close]')) {
        if (switcher.dataset.launch === 'true') return;
        resetPendingSet(switcher);
        setSwitcherOpen(switcher, false);
        return;
      }

      if (event.target.closest('[data-member-set-confirm]')) {
        commitPendingSet(switcher);
        return;
      }

      const button = event.target.closest('.member-set-options [data-member-set]');
      if (!button || !SETS[button.dataset.memberSet]) return;
      setPendingSet(switcher, button.dataset.memberSet);
"""
          js = replace_once(js, old_handler, new_handler, 'click behavior')

          js = replace_once(js, "      if (switcher.dataset.open !== 'true' || switcher.contains(event.target)) return;\n      setSwitcherOpen(switcher, false);", "      if (switcher.dataset.open !== 'true' || switcher.contains(event.target)) return;\n      resetPendingSet(switcher);\n      setSwitcherOpen(switcher, false);", 'outside close reset')
          js = replace_once(js, "      if (switcher.dataset.launch === 'true') return;\n      setSwitcherOpen(switcher, false);\n      switcher.querySelector('[data-member-set-toggle]')?.focus();", "      if (switcher.dataset.launch === 'true') return;\n      resetPendingSet(switcher);\n      setSwitcherOpen(switcher, false);\n      switcher.querySelector('[data-member-set-toggle]')?.focus();", 'escape reset')

          js_path.write_text(js, encoding='utf-8')

          css_path = Path('revive-member-sets.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* MOBILE THEME CONFIRMATION v0.20.1 START */'
          if marker in css:
              raise SystemExit('confirmation CSS already exists')

          css += r'''

/* MOBILE THEME CONFIRMATION v0.20.1 START */
.member-set-popover {
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}

.member-set-confirm-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid color-mix(in srgb, var(--popup-accent) 22%, rgba(255,255,255,.08));
}

.member-set-confirm-row > span {
  min-width: 0;
  overflow: hidden;
  color: color-mix(in srgb, var(--set-muted) 78%, var(--set-paper));
  font-size: .58rem;
  font-weight: 760;
  letter-spacing: .08em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.member-set-confirm {
  min-height: 42px;
  padding: 0 18px;
  border: 1px solid color-mix(in srgb, var(--popup-accent) 58%, white 14%);
  border-radius: 999px;
  color: var(--set-ink, #08070b);
  background: linear-gradient(112deg, var(--set-paper, white), var(--popup-accent) 58%, var(--popup-secondary));
  box-shadow: 0 12px 30px color-mix(in srgb, var(--popup-accent) 22%, transparent);
  font: inherit;
  font-size: .62rem;
  font-weight: 900;
  letter-spacing: .09em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}

.member-set-confirm:hover,
.member-set-confirm:focus-visible {
  filter: brightness(1.08);
  transform: translateY(-1px);
  box-shadow: 0 15px 36px color-mix(in srgb, var(--popup-accent) 30%, transparent);
}

.member-set-confirm:active {
  transform: translateY(0) scale(.985);
}

@media (max-width: 640px) {
  .member-set-switcher-popup[data-launch="true"] .member-set-popover {
    max-height: calc(100dvh - 20px);
    padding-bottom: 0;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-popover::before {
    margin-bottom: 11px;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-popover > p {
    margin-bottom: 13px;
    font-size: .7rem;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-options {
    gap: 6px;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-options button {
    min-height: 54px;
    padding: 11px 13px;
  }

  .member-set-confirm-row {
    position: sticky;
    z-index: 4;
    bottom: 0;
    grid-template-columns: 1fr;
    gap: 8px;
    margin: 12px -17px 0;
    padding: 12px 17px 17px;
    border-top-color: color-mix(in srgb, var(--popup-accent) 30%, rgba(255,255,255,.1));
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--set-panel-strong) 88%, transparent), var(--set-panel-strong) 30%);
    backdrop-filter: blur(16px) saturate(1.12);
    -webkit-backdrop-filter: blur(16px) saturate(1.12);
  }

  .member-set-confirm-row > span {
    text-align: center;
  }

  .member-set-confirm {
    width: 100%;
    min-height: 52px;
    border-radius: 14px;
    font-size: .68rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .member-set-confirm { transition: none; }
}
/* MOBILE THEME CONFIRMATION v0.20.1 END */
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate update
        shell: bash
        run: |
          set -euo pipefail
          node --check revive-member-sets.js
          python - <<'PY'
          from pathlib import Path
          js = Path('revive-member-sets.js').read_text(encoding='utf-8')
          css = Path('revive-member-sets.css').read_text(encoding='utf-8')
          required_js = [
              'data-member-set-confirm',
              'function setPendingSet',
              'function commitPendingSet',
              "const ARCHIVE_VERSION = '0.20.1'"
          ]
          required_css = [
              '.member-set-confirm-row',
              '.member-set-confirm',
              'MOBILE THEME CONFIRMATION v0.20.1'
          ]
          for value in required_js:
              if value not in js:
                  raise SystemExit(f'missing JS integration: {value}')
          for value in required_css:
              if value not in css:
                  raise SystemExit(f'missing CSS integration: {value}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          PY

      - name: Commit mobile confirmation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-mobile-theme-confirmation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add mobile theme confirmation'
          git push
