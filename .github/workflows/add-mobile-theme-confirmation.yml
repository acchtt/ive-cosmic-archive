name: Add mobile theme confirmation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-mobile-theme-confirmation.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply confirmation interaction
        shell: bash
        run: |
          set -euo pipefail
          echo '   bYWN0aXZlU2V0SWRdLmxhYmVsfTwvYnV0dG9uPgogICAgICAgIDwvZGl2PgogICAgICA8L2Rpdj5gOyc    ' | base64 -d > /tmp/add-mobile-theme-confirmation.py
          python /tmp/add-mobile-theme-confirmation.py

      - name: Validate update
        shell: bash
        run: |
          set -euo pipefail
          node --check revive-member-sets.js
          grep -q 'data-member-set-confirm' revive-member-sets.js
          grep -q 'function setPendingSet' revive-member-sets.js
          grep -q 'MOBILE THEME CONFIRMATION v0.20.1' revive-member-sets.css
          python - <<'PY'
          from pathlib import Path
          css = Path('revive-member-sets.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          PY

      - name: Commit mobile confirmation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-mobile-theme-confirmation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add mobile theme confirmation'
          git push
