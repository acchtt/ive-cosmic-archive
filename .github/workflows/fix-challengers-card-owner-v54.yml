name: Fix CHALLENGERS card ownership v54

on:
  push:
    paths:
      - '.github/workflows/fix-challengers-card-owner-v54.yml'
      - 'tools/fix-challengers-card-owner-v54.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v54 CHALLENGERS card ownership sync
        run: python tools/fix-challengers-card-owner-v54.py
      - name: Commit v54
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop CHALLENGERS member card replacement v54"
          git push
