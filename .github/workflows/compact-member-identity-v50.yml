name: Compact mobile member identity v50

on:
  push:
    paths:
      - '.github/workflows/compact-member-identity-v50.yml'
      - 'tools/compact-member-identity-v50.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v50 compact member identity
        run: python tools/compact-member-identity-v50.py
      - name: Commit v50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact mobile member identity and social rail v50"
          git push
