name: Mobile signature result override v52

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-signature-result-v52.yml'
      - 'tools/fix-mobile-signature-result-v52.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v52 mobile signature result override
        run: python tools/fix-mobile-signature-result-v52.py
      - name: Commit v52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile signature result override v52"
          git push
