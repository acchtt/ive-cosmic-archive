name: spoilers-media-debug

on:
  push:
    paths:
      - '.github/workflows/spoilers-media-debug.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official post media arrays
        shell: bash
        run: |
          set -euo pipefail
          while read -r member id; do
            echo "=== ${member} ==="
            curl -fsSL "https://api.vxtwitter.com/IVEstarship/status/${id}" | jq -c '{mediaURLs, media_extended: [.media_extended[]? | {url,type,thumbnail_url}]}'
          done <<'EOF'
          gaeul 2016151017696723199
          yujin 2016151111749820512
          rei 2016150820228890959
          wonyoung 2016150607573483593
          liz 2016150914076443139
          leeseo 2016150712049402127
          EOF
