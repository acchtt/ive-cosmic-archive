name: Refresh mobile selector launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-mobile-selector-launch.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version mobile launch state and boot assets
        run: |
          python <<'PY'
          from pathlib import Path

          launch_key_old = "ive-cosmic-revive-launch-seen"
          launch_key_new = "ive-cosmic-revive-launch-seen-clean-v2"
          asset_version = "mobile-launch-v2"

          replacements = {
              "album-theme-sync.js": [
                  (f"const LAUNCH_KEY = '{launch_key_old}';", f"const LAUNCH_KEY = '{launch_key_new}';"),
                  ("const MOBILE_ASSET_VERSION = 'b8fc11b';", f"const MOBILE_ASSET_VERSION = '{asset_version}';"),
              ],
              "mobile-theme-picker.js": [
                  (f"const LAUNCH_KEY = '{launch_key_old}';", f"const LAUNCH_KEY = '{launch_key_new}';"),
              ],
              "index.html": [
                  ('<script src="album-theme-sync.js"></script>', f'<script src="album-theme-sync.js?v={asset_version}"></script>'),
              ],
              "members.html": [
                  ('<script src="album-theme-sync.js"></script>', f'<script src="album-theme-sync.js?v={asset_version}"></script>'),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {file_name}: {old}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"No changes made to {file_name}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/refresh-mobile-selector-launch.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album-theme-sync.js mobile-theme-picker.js index.html members.html .github/workflows/refresh-mobile-selector-launch.yml
          git commit -m "Force refreshed mobile selector launch"
          git push
