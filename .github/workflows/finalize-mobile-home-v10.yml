name: Finalize mobile home campaign v10

on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-home-v10.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load mobile home campaign assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sync = Path('album-theme-sync.js')
          text = sync.read_text()
          text = text.replace("const MOBILE_ASSET_VERSION = 'mobile-shell-v9';", "const MOBILE_ASSET_VERSION = 'mobile-home-v10';")
          needle = "    appendStylesheet('mobile-page-shell-fix.css');\n    appendStylesheet('mobile-theme-picker-cover-grid.css');"
          replacement = "    appendStylesheet('mobile-page-shell-fix.css');\n    if (page === 'index') appendStylesheet('mobile-home-campaign-v10.css');\n    appendStylesheet('mobile-theme-picker-cover-grid.css');"
          if needle not in text:
              raise SystemExit('Could not locate mobile stylesheet loader')
          text = text.replace(needle, replacement, 1)
          sync.write_text(text)

          for name in ('index.html', 'members.html'):
              path = Path(name)
              html = path.read_text()
              html = re.sub(r'album-theme-sync\.js\?v=[^"\']+', 'album-theme-sync.js?v=mobile-home-v10', html, count=1)
              path.write_text(html)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-mobile-home-v10.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album-theme-sync.js index.html members.html .github/workflows/finalize-mobile-home-v10.yml
          git commit -m "Finalize mobile campaign board redesign"
          git push
