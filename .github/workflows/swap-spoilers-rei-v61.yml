name: Align SPOILERS Rei v61

on:
  push:
    paths:
      - '.github/workflows/swap-spoilers-rei-v61.yml'
      - 'tools/swap-spoilers-rei-v61.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching dependencies
        run: python -m pip install --disable-pip-version-check pillow requests 'opencv-python-headless==4.12.0.88'
      - name: Align Rei SPOILERS card
        run: python tools/swap-spoilers-rei-v61.py
      - name: Commit v61
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-spoilers-rei-v61.yml tools/swap-spoilers-rei-v61.py
          git add -A
          git commit -m "Align SPOILERS Rei card v61"
          git push
