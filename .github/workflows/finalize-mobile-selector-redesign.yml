name: Finalize mobile selector redesign

on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-selector-redesign.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh mobile selector entry assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ('index.html', 'members.html'):
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'album-theme-sync.js?v=mobile-launch-v2',
                  'album-theme-sync.js?v=campaign-mobile-v4'
              )
              text = text.replace(
                  "sessionStorage.getItem('ive-cosmic-revive-launch-seen')",
                  "sessionStorage.getItem('ive-cosmic-revive-launch-seen-clean-v2')"
              )
              path.write_text(text)
          PY
          rm -f .github/workflows/finalize-mobile-selector-redesign.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html members.html .github/workflows/finalize-mobile-selector-redesign.yml
          git commit -m "Finalize campaign-aligned mobile selector" || exit 0
          git push
