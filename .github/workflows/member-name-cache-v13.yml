name: Member name cache v13

on:
  push:
    paths:
      - '.github/workflows/member-name-cache-v13.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh bootstrap URLs
        run: |
          sed -i 's/album-theme-sync.js?v=mobile-shell-v9/album-theme-sync.js?v=mobile-member-names-v13/g' index.html members.html
      - name: Commit refreshed URLs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html members.html
          git diff --cached --quiet || git commit -m 'Load full mobile member names'
          git push origin main
# trigger: 2
