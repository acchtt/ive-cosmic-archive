name: Unify LUMINARE logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-luminare-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Standardize LUMINARE identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '0.19.1'
          BUILD = '020'

          mark = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LUMINARE starburst">
            <defs>
              <linearGradient id="luminare" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                <stop stop-color="#fff8fb"/>
                <stop offset="0.48" stop-color="#ffb5ca"/>
                <stop offset="1" stop-color="#ff5e8a"/>
              </linearGradient>
            </defs>
            <path fill="url(#luminare)" d="M32 2l4.7 25.3L62 32l-25.3 4.7L32 62l-4.7-25.3L2 32l25.3-4.7L32 2Z"/>
            <path d="M14 14l36 36M50 14L14 50" stroke="url(#luminare)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
          </svg>
          '''
          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          (assets / 'luminare-mark.svg').write_text(mark, encoding='utf-8')

          anchor_pattern = re.compile(
              r'(?P<open><a class="brand(?: footer-brand)?" href="index\.html"[^>]*>)(?P<body>[\s\S]*?)</a>',
              re.I,
          )

          def normalize_anchor(match):
              opening = match.group('open')
              body = match.group('body')
              if 'brand-mark' not in body and 'brand-emblem' not in body:
                  return match.group(0)
              opening = re.sub(r'\s+aria-label="[^"]*"', '', opening)
              opening = opening[:-1] + ' aria-label="LUMINARE · IVE Archive home">'
              return f'''{opening}
        <img class="brand-emblem" src="assets/luminare-mark.svg" alt="" width="34" height="34" />
        <span class="brand-lockup">
          <span class="brand-mark">LUMINARE</span>
          <span class="brand-sub">IVE Archive</span>
        </span>
      </a>'''

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('IVE Cosmic Archive', 'LUMINARE · IVE Archive')
              text = anchor_pattern.sub(normalize_anchor, text)

              canonical_icon = '  <link rel="icon" type="image/svg+xml" href="assets/luminare-mark.svg" />'
              if re.search(r'<link\s+rel="icon"[^>]*>', text, re.I):
                  text = re.sub(r'\s*<link\s+rel="icon"[^>]*>', '\n' + canonical_icon, text, count=1, flags=re.I)
              elif '</title>' in text:
                  text = text.replace('</title>', '</title>\n' + canonical_icon, 1)

              if 'class="site-header"' in text and 'header-editorial-glass.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="header-editorial-glass.css" />\n</head>', 1)

              text = re.sub(r'Archive build\s*·\s*\d+', f'Archive build · {BUILD}', text)
              text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', f'· v{VERSION}', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          css_path = Path('header-editorial-glass.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* LUMINARE identity lockup. */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip()

          css += r'''

/* LUMINARE identity lockup. One canonical SVG is used everywhere. */
html body .site-header {
  grid-template-columns: minmax(268px, auto) 1fr auto;
}

html body .site-header .brand,
html body .site-footer .brand {
  align-items: center;
  gap: 13px;
}

html body .brand-emblem {
  display: block;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  object-fit: contain;
  filter:
    drop-shadow(0 0 8px color-mix(in srgb, var(--header-accent, #ff789c) 46%, transparent))
    drop-shadow(0 0 18px color-mix(in srgb, var(--header-accent, #ff789c) 18%, transparent));
}

html body .brand-lockup {
  min-width: 0;
  display: grid;
  gap: 4px;
  padding-left: 14px;
  border-left: 1px solid color-mix(in srgb, var(--header-accent, #ff789c) 34%, rgba(255,255,255,.18));
  line-height: 1;
}

html body .site-header .brand-mark,
html body .site-footer .brand-mark {
  color: var(--header-paper, #fff7fb);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: .17em;
  text-shadow:
    0 0 18px color-mix(in srgb, var(--header-accent, #ff789c) 22%, transparent),
    0 1px 0 rgba(255,255,255,.08);
}

html body .site-header .brand-sub,
html body .site-footer .brand-sub {
  margin: 0;
  padding: 0;
  border: 0;
  color: color-mix(in srgb, var(--header-muted, #bbaeb9) 76%, white 16%);
  font-size: .52rem;
  font-weight: 650;
  letter-spacing: .26em;
  text-transform: uppercase;
  white-space: nowrap;
}

html body .site-footer .footer-brand { width: max-content; }
html body .site-footer .brand-emblem { width: 34px; height: 34px; flex-basis: 34px; }
html body .site-footer .brand-lockup { gap: 4px; padding-left: 14px; }

@media (max-width: 980px) {
  html body .site-header { grid-template-columns: auto 1fr auto auto; }
  html body .site-header .brand-lockup { padding-left: 11px; }
  html body .site-header .brand-mark { font-size: .94rem; letter-spacing: .13em; }
}

@media (max-width: 640px) {
  html body .site-header .brand { gap: 8px; }
  html body .site-header .brand-emblem { width: 28px; height: 28px; flex-basis: 28px; }
  html body .site-header .brand-lockup { padding-left: 9px; }
  html body .site-header .brand-mark { font-size: .82rem; letter-spacing: .1em; }
  html body .site-header .brand-sub { display: none; }
}
'''
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('revive-member-sets.js')
          if js_path.exists():
              js = js_path.read_text(encoding='utf-8')
              js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", f"const ARCHIVE_VERSION = '{VERSION}';", js, count=1)
              js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", f"const ARCHIVE_BUILD = '{BUILD}';", js, count=1)
              js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit unified identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/luminare-mark.svg header-editorial-glass.css revive-member-sets.js *.html
          git commit -m "Unify LUMINARE logo across the archive"
          git push origin main
