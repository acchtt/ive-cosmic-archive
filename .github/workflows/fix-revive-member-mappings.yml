name: Fix REVIVE+ member mappings

on:
  pull_request:
    branches: [main]
    paths:
      - .github/fix-revive-member-mappings.trigger

permissions:
  contents: write

jobs:
  fix-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-revive-member-mappings
          fetch-depth: 0

      - name: Download correctly labeled member portraits
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import time
          import urllib.request
          from pathlib import Path

          SOURCES = {
              "challengers": {
                  "gaeul": "https://i.imgur.com/U9c80gv.jpg",
                  "yujin": "https://i.imgur.com/ZVnaaYc.jpg",
                  "rei": "https://i.imgur.com/V5MRKib.jpg",
                  "wonyoung": "https://i.imgur.com/fk5Pt1u.jpg",
                  "liz": "https://i.imgur.com/j6WvOG4.jpg",
                  "leeseo": "https://i.imgur.com/6o4i2dg.jpg",
              },
              "spoilers": {
                  "gaeul": "https://i.imgur.com/07h20N1.jpg",
                  "yujin": "https://i.imgur.com/C9eiRHl.jpg",
                  "rei": "https://i.imgur.com/QzkZue5.jpg",
                  "wonyoung": "https://i.imgur.com/7um9Vbl.jpg",
                  "liz": "https://i.imgur.com/gRgyYBN.jpg",
                  "leeseo": "https://i.imgur.com/qZgZL3X.jpg",
              },
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
              "Referer": "https://www.ptt.cc/",
          }

          def download(url: str) -> bytes:
              errors = []
              for attempt in range(1, 5):
                  try:
                      request = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(request, timeout=60) as response:
                          data = response.read()
                      if len(data) < 20_000:
                          raise RuntimeError(f"payload too small: {len(data)} bytes")
                      if not data.startswith(b"\xff\xd8\xff"):
                          raise RuntimeError("payload is not JPEG")
                      return data
                  except Exception as exc:
                      errors.append(f"attempt {attempt}: {exc}")
                      time.sleep(attempt * 2)
              raise RuntimeError(f"Failed to download {url}: {'; '.join(errors)}")

          manifest_path = Path("assets/revive/member-cards/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries = {(entry["set"], entry["member"]): entry for entry in manifest["assets"]}
          hashes = set()

          for set_id, members in SOURCES.items():
              for member, source in members.items():
                  data = download(source)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in hashes:
                      raise RuntimeError(f"Duplicate image detected for {set_id}/{member}")
                  hashes.add(digest)

                  target = Path(f"assets/revive/member-cards/{set_id}/{member}.jpg")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

                  entry = entries[(set_id, member)]
                  entry.update({
                      "path": target.as_posix(),
                      "source": source,
                      "resolved_source": source,
                      "bytes": len(data),
                      "sha256": digest,
                  })
                  print(f"Updated {set_id}/{member}: {len(data):,} bytes")

          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          if len(hashes) != 12:
              raise RuntimeError(f"Expected 12 unique corrected images, found {len(hashes)}")
          PY

      - name: Commit corrected assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/revive/member-cards/challengers assets/revive/member-cards/spoilers assets/revive/member-cards/manifest.json
          git commit -m "Correct Challengers and Spoilers member cards"
          git push origin fix-revive-member-mappings
