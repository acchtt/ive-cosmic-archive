name: Align CHALLENGERS Gaeul v59

on:
  push:
    paths:
      - '.github/workflows/swap-challengers-gaeul-v59.yml'
      - 'tools/swap-challengers-gaeul-v59.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Align Gaeul CHALLENGERS card
        run: python tools/swap-challengers-gaeul-v59.py
      - name: Commit v59
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-challengers-gaeul-v59.yml tools/swap-challengers-gaeul-v59.py
          git add -A
          git commit -m "Align CHALLENGERS Gaeul card v59"
          git push
