name: Rework REVIVE+ version switcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rework-version-switcher.yml'

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply selector redesign
        run: python3 scripts/rework_version_switcher.py

      - name: Commit selector redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revive-member-sets.css revive-member-sets.js index.html members.html eras.html media.html
          git commit -m "Rework REVIVE+ version selector"
          git push origin main

# trigger registered workflow
