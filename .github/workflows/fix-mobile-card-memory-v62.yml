name: Fix mobile card memory v62

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-card-memory-v62.yml'
      - 'tools/fix-mobile-card-memory-v62.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply memory fix
        run: python tools/fix-mobile-card-memory-v62.py
      - name: Commit v62
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mobile-card-memory-v62.yml tools/fix-mobile-card-memory-v62.py
          git add -A
          git commit -m "Fix mobile member-card memory pressure v62"
          git push
