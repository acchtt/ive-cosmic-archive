name: Member birthdays and social row v47

on:
  push:
    paths:
      - 'tools/finalize-member-birthdays-v47.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v47
        run: python tools/finalize-member-birthdays-v47.py
      - name: Commit v47
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add member birthdays and align social pills v47"
          git push
