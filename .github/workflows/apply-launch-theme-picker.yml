name: Apply launch theme picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-launch-theme-picker.yml'

permissions:
  contents: write

jobs:
  apply-launch-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add launch modal and change hint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('revive-member-sets.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const ARCHIVE_VERSION = '[^']+';", "const ARCHIVE_VERSION = '0.14.0';", js, count=1)
          js = re.sub(r"const ARCHIVE_BUILD = '[^']+';", "const ARCHIVE_BUILD = '014';", js, count=1)
          js = js.replace(
              "  const STORAGE_KEY = 'ive-cosmic-revive-member-set';\n",
              "  const STORAGE_KEY = 'ive-cosmic-revive-member-set';\n  const LAUNCH_KEY = 'ive-cosmic-revive-launch-seen';\n"
          )

          has_stored_pattern = re.compile(r"  function hasStoredSet\(\) \{[\s\S]*?\n  \}\n", re.M)
          has_stored_replacement = '''  function hasStoredSet() {
    try {
      return Boolean(SETS[window.localStorage.getItem(STORAGE_KEY)]);
    } catch {
      return false;
    }
  }

  function hasSeenLaunchPicker() {
    try {
      return window.sessionStorage.getItem(LAUNCH_KEY) === 'true';
    } catch {
      return false;
    }
  }

  function markLaunchPickerSeen() {
    try {
      window.sessionStorage.setItem(LAUNCH_KEY, 'true');
    } catch {
      // The launch picker still works when session storage is unavailable.
    }
  }
'''
          js, count = has_stored_pattern.subn(has_stored_replacement, js, count=1)
          if count != 1:
              raise RuntimeError('Could not extend stored-theme helpers')

          switcher_replacement = '''  let changeHintTimer = 0;

  function setSwitcherOpen(switcher, open) {
    if (!switcher) return;
    switcher.dataset.open = String(open);
    if (open) switcher.dataset.hintVisible = 'false';
    const toggle = switcher.querySelector('[data-member-set-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', String(open));
  }

  function showChangeHint(switcher) {
    if (!switcher) return;
    window.clearTimeout(changeHintTimer);
    switcher.dataset.hintVisible = 'true';
    changeHintTimer = window.setTimeout(() => {
      switcher.dataset.hintVisible = 'false';
    }, 6500);
  }

  function createSwitcher() {
    const existing = document.querySelector('[data-member-set-switcher]');
    if (existing) return existing;

    const switcher = document.createElement('aside');
    const launchOpen = !hasSeenLaunchPicker() || !hasStoredSet();
    switcher.className = 'member-set-switcher-popup';
    switcher.dataset.memberSetSwitcher = '';
    switcher.dataset.open = String(launchOpen);
    switcher.dataset.launch = String(launchOpen);
    switcher.dataset.hintVisible = 'false';
    switcher.setAttribute('aria-label', 'REVIVE+ album-version theme selector');
    switcher.innerHTML = `
      <div class="member-set-launch-backdrop" aria-hidden="true"></div>
      <button class="member-set-dock" type="button" data-member-set-toggle aria-expanded="${launchOpen}" aria-controls="revive-version-menu">
        <span class="member-set-dock-dot" aria-hidden="true"></span>
        <span class="member-set-dock-label">REVIVE+ edition</span>
        <strong data-member-set-title>${SETS[activeSetId].label}</strong>
        <span class="member-set-dock-action" aria-hidden="true">Change</span>
      </button>
      <div class="member-set-change-hint" role="status" aria-live="polite">
        <span>Theme set. You can change it anytime from this button.</span>
        <button type="button" data-member-set-hint-close aria-label="Dismiss theme-change tip">×</button>
      </div>
      <div class="member-set-popover" id="revive-version-menu" role="dialog" aria-modal="${launchOpen}" aria-label="Choose a REVIVE+ album version">
        <div class="member-set-popover-head">
          <div>
            <span>REVIVE+ launch theme</span>
            <strong>Which edition do you want?</strong>
          </div>
          <button type="button" class="member-set-close" data-member-set-close aria-label="Close edition menu">×</button>
        </div>
        <p data-member-set-description>${SETS[activeSetId].description}</p>
        <div class="member-set-options" role="group" aria-label="Choose a REVIVE+ album-version theme and member-card set">
          ${SET_ORDER.map((setId) => `
            <button type="button" data-member-set="${setId}" aria-pressed="${setId === activeSetId}" aria-label="Use the ${SETS[setId].label} version theme">
              <span>${SETS[setId].label}</span>
              <small>06 cards</small>
            </button>`).join('')}
        </div>
      </div>`;

    document.body.appendChild(switcher);

    switcher.addEventListener('click', (event) => {
      if (event.target.closest('[data-member-set-hint-close]')) {
        switcher.dataset.hintVisible = 'false';
        window.clearTimeout(changeHintTimer);
        return;
      }

      const toggle = event.target.closest('[data-member-set-toggle]');
      if (toggle) {
        switcher.dataset.launch = 'false';
        switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
        setSwitcherOpen(switcher, switcher.dataset.open !== 'true');
        return;
      }

      if (event.target.closest('[data-member-set-close]')) {
        if (switcher.dataset.launch === 'true') return;
        setSwitcherOpen(switcher, false);
        return;
      }

      const button = event.target.closest('[data-member-set]');
      if (!button || !SETS[button.dataset.memberSet]) return;

      const wasLaunch = switcher.dataset.launch === 'true';
      setActiveSet(button.dataset.memberSet);
      if (wasLaunch) markLaunchPickerSeen();
      switcher.dataset.launch = 'false';
      switcher.querySelector('.member-set-popover')?.setAttribute('aria-modal', 'false');
      setSwitcherOpen(switcher, false);
      showChangeHint(switcher);
      switcher.querySelector('[data-member-set-toggle]')?.focus();
    });

    document.addEventListener('pointerdown', (event) => {
      if (switcher.dataset.launch === 'true') return;
      if (switcher.dataset.open !== 'true' || switcher.contains(event.target)) return;
      setSwitcherOpen(switcher, false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || switcher.dataset.open !== 'true') return;
      if (switcher.dataset.launch === 'true') return;
      setSwitcherOpen(switcher, false);
      switcher.querySelector('[data-member-set-toggle]')?.focus();
    });

    return switcher;
  }

  function updateThemeColor'''
          js, count = re.subn(
              r"  function setSwitcherOpen\(switcher, open\) \{[\s\S]*?\n  \}\n\n  function updateThemeColor",
              switcher_replacement,
              js,
              count=1
          )
          if count != 1:
              raise RuntimeError('Could not replace popup controller')
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('revive-member-sets.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'/\* LAUNCH MODAL v[\s\S]*? END \*/\s*$', '', css).rstrip()
          css += r'''

/* LAUNCH MODAL v0.14.0 START */
.member-set-launch-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: rgba(3, 2, 7, .7);
  backdrop-filter: blur(12px) saturate(.86);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .22s ease, visibility .22s ease;
}

.member-set-switcher-popup[data-launch="true"] .member-set-launch-backdrop {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.member-set-switcher-popup[data-launch="true"] .member-set-dock {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.member-set-switcher-popup[data-launch="true"] .member-set-popover {
  position: fixed;
  z-index: 2;
  left: 50%;
  right: auto;
  top: 50%;
  bottom: auto;
  width: min(520px, calc(100vw - 32px));
  padding: 20px;
  border-radius: 24px;
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center;
}

.member-set-switcher-popup[data-launch="true"] .member-set-popover::before {
  content: "SELECT YOUR ARCHIVE THEME";
  display: block;
  margin-bottom: 14px;
  color: color-mix(in srgb, var(--popup-accent) 72%, white 12%);
  font-size: .5rem;
  font-weight: 850;
  letter-spacing: .2em;
}

.member-set-switcher-popup[data-launch="true"] .member-set-popover-head strong {
  font-size: clamp(1.28rem, 3vw, 1.72rem);
}

.member-set-switcher-popup[data-launch="true"] .member-set-popover > p {
  max-width: 440px;
  margin-bottom: 16px;
  font-size: .74rem;
}

.member-set-switcher-popup[data-launch="true"] .member-set-close {
  display: none;
}

.member-set-switcher-popup[data-launch="true"] .member-set-options button {
  min-height: 72px;
  padding: 14px;
}

.member-set-switcher-popup[data-launch="true"] .member-set-options button span {
  font-size: .72rem;
}

.member-set-change-hint {
  pointer-events: auto;
  position: absolute;
  right: 0;
  bottom: calc(100% + 10px);
  width: min(278px, calc(100vw - 32px));
  min-height: 52px;
  padding: 11px 36px 11px 13px;
  border: 1px solid color-mix(in srgb, var(--popup-accent) 35%, rgba(255,255,255,.1));
  border-radius: 14px;
  color: var(--set-paper, white);
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--set-panel-strong) 96%, transparent), color-mix(in srgb, var(--set-bg) 92%, transparent));
  box-shadow: 0 18px 48px rgba(0,0,0,.4), 0 0 22px color-mix(in srgb, var(--popup-accent) 9%, transparent);
  backdrop-filter: blur(20px) saturate(1.12);
  font-size: .65rem;
  line-height: 1.42;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px) scale(.98);
  transform-origin: right bottom;
  transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
}

.member-set-change-hint::after {
  content: "";
  position: absolute;
  right: 24px;
  bottom: -6px;
  width: 10px;
  height: 10px;
  border-right: 1px solid color-mix(in srgb, var(--popup-accent) 35%, rgba(255,255,255,.1));
  border-bottom: 1px solid color-mix(in srgb, var(--popup-accent) 35%, rgba(255,255,255,.1));
  background: color-mix(in srgb, var(--set-bg) 92%, transparent);
  transform: rotate(45deg);
}

.member-set-change-hint button {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  color: color-mix(in srgb, var(--set-paper) 60%, transparent);
  background: rgba(255,255,255,.04);
  cursor: pointer;
}

.member-set-switcher-popup[data-hint-visible="true"][data-open="false"][data-launch="false"] .member-set-change-hint {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

@media (max-width: 640px) {
  .member-set-switcher-popup[data-launch="true"] .member-set-popover {
    width: min(calc(100vw - 20px), 520px);
    padding: 17px;
    border-radius: 20px;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-options {
    grid-template-columns: 1fr;
  }

  .member-set-switcher-popup[data-launch="true"] .member-set-options button {
    min-height: 58px;
  }

  .member-set-change-hint {
    left: 0;
    right: 0;
    width: 100%;
    transform-origin: center bottom;
  }
}

@media (prefers-reduced-motion: reduce) {
  .member-set-launch-backdrop,
  .member-set-change-hint {
    transition: none;
  }
}
/* LAUNCH MODAL v0.14.0 END */
'''
          css_path.write_text(css, encoding='utf-8')

          for html_name in ['index.html', 'members.html', 'eras.html', 'media.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              match = re.search(r'<p class="footer-code">(.*?)</p>', text, flags=re.S)
              if not match:
                  continue
              value = match.group(1).strip()
              value = re.sub(r'Archive build\s*·\s*\d+', 'Archive build · 014', value)
              value = re.sub(r'\s*·\s*v\d+(?:\.\d+){1,2}.*$', '', value)
              value = f'{value} · v0.14.0'
              text = text[:match.start()] + f'<p class="footer-code">{value}</p>' + text[match.end():]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit launch picker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revive-member-sets.js revive-member-sets.css index.html members.html eras.html media.html
          git commit -m "Add launch theme picker and change hint"
          git push origin main
