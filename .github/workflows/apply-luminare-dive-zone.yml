name: Apply LUMINARE to DIVE Zone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-luminare-dive-zone.yml'

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply LUMINARE identity to DIVE Zone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('dive-zone.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('IVE Cosmic Archive', 'LUMINARE · IVE Archive')

          pattern = re.compile(
              r'(?P<open><a class="brand" href="index\.html"[^>]*>)\s*'
              r'<span class="brand-mark">IVE</span>\s*'
              r'<span class="brand-sub">Cosmic Archive</span>\s*'
              r'</a>',
              re.S,
          )

          def repl(match):
              opening = match.group('open')
              if 'aria-label=' not in opening:
                  opening = opening[:-1] + ' aria-label="LUMINARE IVE Archive home">'
              return f'''{opening}
      <span class="brand-emblem" aria-hidden="true"></span>
      <span class="brand-lockup">
        <span class="brand-mark">LUMINARE</span>
        <span class="brand-sub">IVE Archive</span>
      </span>
    </a>'''

          text = pattern.sub(repl, text)

          if 'assets/luminare-mark.svg' not in text:
              text = text.replace('</title>', '</title>\n  <link rel="icon" type="image/svg+xml" href="assets/luminare-mark.svg" />', 1)

          if 'header-editorial-glass.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="header-editorial-glass.css" />\n</head>', 1)

          text = re.sub(r'Archive build\s*·\s*\d+', 'Archive build · 019', text)
          text = re.sub(r'·\s*v\d+(?:\.\d+){1,2}', '· v0.19.0', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit DIVE Zone brand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dive-zone.html
          git commit -m "Apply LUMINARE brand to DIVE Zone"
          git push origin main

# Triggered after the workflow was registered on main.
