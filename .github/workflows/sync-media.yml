name: Sync official media archive

on:
  push:
    branches:
      - main
      - agent/expand-official-media-archive
    paths:
      - .github/workflows/sync-media.yml
      - scripts/sync-media.mjs
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Build media index
        run: node scripts/sync-media.mjs

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- media-index.json; then
            echo "Media index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-index.json
          git commit -m "Update official media index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
