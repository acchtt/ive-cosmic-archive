name: Run editorial glass refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run registered header refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/remove-header-active-dot.yml').read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Strengthen Option B styling\n        shell: bash\n        run: \|\n([\s\S]*?)\n      - name: Commit production change",
              workflow,
          )
          if not match:
              raise RuntimeError('Could not locate registered header refinement')

          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          Path('/tmp/refine-editorial-header.sh').write_text(script + '\n', encoding='utf-8')
          PY
          bash /tmp/refine-editorial-header.sh

      - name: Commit production refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header-editorial-glass.css revive-member-sets.js index.html members.html eras.html media.html
          git commit -m "Strengthen editorial glass header styling"
          git push origin main
