name: Swap SPOILERS alternates v60

on:
  push:
    paths:
      - '.github/workflows/swap-spoilers-alternates-v60.yml'
      - 'tools/swap-spoilers-alternates-v60.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching dependencies
        run: python -m pip install --disable-pip-version-check pillow requests 'opencv-python-headless==4.12.0.88'
      - name: Select SPOILERS alternates
        run: python tools/swap-spoilers-alternates-v60.py
      - name: Commit v60
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-spoilers-alternates-v60.yml tools/swap-spoilers-alternates-v60.py
          git add -A
          git commit -m "Swap SPOILERS alternate member cards v60"
          git push
