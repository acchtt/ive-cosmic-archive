name: Fetch coherent member cardsets v56

on:
  push:
    paths:
      - '.github/workflows/fetch-coherent-member-cardsets-v56.yml'
      - 'tools/fetch-coherent-member-cardsets-v56.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch and normalize coherent member cardsets
        run: python tools/fetch-coherent-member-cardsets-v56.py
      - name: Commit v56
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align REVIVE+ member cardsets v56"
          git push
